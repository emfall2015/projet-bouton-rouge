name: MALICK - CI - Build et Push Docker

run-name: ${{ github.actor }} - CI

on:
  pull_request:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Gitleaks, health, Audit, Tests et Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le dépôt et tout son historique Git
      - name: 1. Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Scanner l'historique Git avec Gitleaks
      - name: 2. Détecter les secrets dans Git
        run: |
          docker run --rm \
            --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/path \
            -v "$GITHUB_WORKSPACE:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="--all" \
            --redact \
            --exit-code 1 \
            /path

      # 3. Scanner les fichiers courants
      - name: 3. Détecter les secrets dans les fichiers
        run: |
          docker run --rm \
            --network none \
            -v "$GITHUB_WORKSPACE:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir \
            --redact \
            --exit-code 1 \
            /path

      
      # 4. Scanner les fichiers et dépendances avec Trivy
      - name: 4. Scanner le dépôt avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'


      # 4. Créer le fichier .env du backend
      - name: 4. Créer le fichier .env
        run: |
          echo "PORT=3002" > backend/.env

      # 5. Installer les dépendances du backend
      - name: 5. Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: NPM Audit - Production
        working-directory: backend
        run: npm audit --omit=dev

      - name: NPM Audit - All dependencies
        working-directory: backend
        run: npm audit --audit-level=moderate

      # 6. Exécuter les tests
      - name: 6. Exécuter les tests
        working-directory: backend
        run: npm test

      # 7. Construire l'image backend
      - name: 7. Construire le backend
        run: |
          docker build \
            -t emfall/bouton-rouge-backend:latest \
            ./backend

       # 7. Scanner  l'image backend
      - name: 7.1 Scanner l'image backend avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: emfall/bouton-rouge-backend:latest
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # 8. Construire l'image frontend
      - name: 8. Construire le frontend
        run: |
          docker build \
            -t emfall/bouton-rouge-frontend:latest \
            ./frontend
      # 8.1 Scanner l'image frontend
      - name: Scanner l'image frontend avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: emfall/bouton-rouge-frontend:latest
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # 9. Lancer les conteneurs pour les tests
      - name: 9. Lancer les conteneurs
        run: docker compose up -d

      # 10. Vérifier l'état des conteneurs
      - name: 10. Vérifier les conteneurs
        run: docker compose ps

      # 11. Tester la disponibilité du backend
      - name: 11. Tester le backend
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://localhost:3002/api/health; then
              echo "Backend disponible !"
              exit 0
            fi

            sleep 1
          done

          echo "Le backend ne répond pas"
          docker compose logs backend
          exit 1

      # 12. Tester l'API
      - name: 12. Tester les endpoints
        run: |
          curl --fail http://localhost:3002/api/health

      # 13. Tester le frontend
      - name: 13. Tester le frontend
        run: |
          curl --fail http://localhost:4202/

      # 14. Afficher les logs en cas de problème
      - name: 14. Afficher les logs
        if: always()
        run: docker compose logs

      # 15. Arrêter les conteneurs
      - name: 15. Arrêter les conteneurs
        if: always()
        run: docker compose down

      # 16. Connexion à Docker Hub uniquement pour une exécution manuelle
      - name: 16. Connexion à Docker Hub
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 17. Publier le backend uniquement après tous les contrôles
      - name: 17. Push backend
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch'
        run: |
          docker push emfall/bouton-rouge-backend:latest

      # 18. Publier le frontend uniquement après tous les contrôles
      - name: 18. Push frontend
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch'
        run: |
          docker push emfall/bouton-rouge-frontend:latest

