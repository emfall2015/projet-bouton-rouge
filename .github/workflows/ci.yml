
name: MALICK - CI - Build et Push Docker

run-name: ${{ github.actor }} - CI

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Gitleaks, Tests et Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer tout l'historique Git
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Scanner l'historique Git
      - name: Gitleaks - Scan Git history
        run: |
          docker run --rm \
            --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/path \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/path,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="--all" \
            --redact --exit-code 1 /path

      # 3. Scanner les fichiers du dépôt
      - name: Gitleaks - Scan files
        run: |
          docker run --rm \
            --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/path,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact --exit-code 1 /path

      # 4. Configurer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 5. Installer les dépendances backend
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # 6. Créer l'environnement nécessaire aux tests
      - name: Configure backend environment
        run: |
          echo "PORT=3002" > backend/.env

      # 7. Exécuter les tests
      - name: Run backend tests
        working-directory: backend
        run: npm test

      # 8. Construire les images Docker
      - name: Build backend image
        run: |
          docker build \
            -t emfall/bouton-rouge-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t emfall/bouton-rouge-frontend:latest \
            ./frontend

      # 9. Démarrer les services
      - name: Start Docker Compose
        run: docker compose up -d

      # 10. Vérifier l'état des conteneurs
      - name: Check Docker Compose
        run: docker compose ps

      # 11. Vérifier le backend
      - name: Check backend health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3002/health; then
              echo "Backend accessible."
              exit 0
            fi
            sleep 2
          done
          echo "Backend inaccessible après 60 secondes."
          exit 1

      # 12. Vérifier le frontend
      - name: Check frontend
        run: |
          curl --fail --show-error --silent \
            http://localhost:3000/

      # 13. Afficher les logs, même en cas d'échec
      - name: Docker logs
        if: always()
        run: docker compose logs --no-color || true

      # 14. Arrêter les conteneurs
      - name: Stop Docker Compose
        if: always()
        run: docker compose down --remove-orphans

      # 15. Connexion Docker Hub uniquement au lancement manuel
      - name: Login to Docker Hub
        if: success() && github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 16. Publier les images uniquement si toutes les étapes précédentes réussissent
      - name: Push backend image
        if: success() && github.event_name == 'workflow_dispatch'
        run: docker push emfall/bouton-rouge-backend:latest

      - name: Push frontend image
        if: success() && github.event_name == 'workflow_dispatch'
        run: docker push emfall/bouton-rouge-frontend:latest
